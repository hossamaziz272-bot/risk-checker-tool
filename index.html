<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>أداة تحليل المخاطر</title>

  <style>
    body{
      font-family: Arial;
      background:#f5f5f5;
      padding:40px;
    }

    .container{
      max-width:700px;
      margin:auto;
      background:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      color:#222;
    }

    input{
      width:100%;
      padding:15px;
      margin-top:15px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:18px;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:15px;
      background:#111;
      color:white;
      border:none;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
    }

    .result{
      margin-top:20px;
      padding:20px;
      background:#f1f1f1;
      border-radius:10px;
    }

    table{
      width:100%;
      margin-top:20px;
      border-collapse:collapse;
    }

    th, td{
      border:1px solid #ddd;
      padding:10px;
      text-align:center;
    }

    th{
      background:#111;
      color:white;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>أداة تحليل المخاطر</h1>

  <input type="text" id="phone" placeholder="اكتب رقم العميل">

  <button onclick="checkRisk()">تحليل الرقم</button>

  <div class="result" id="result"></div>

  <h2>السجل</h2>

  <table>
    <thead>
      <tr>
        <th>الرقم</th>
        <th>الاسكور</th>
        <th>المستوى</th>
      </tr>
    </thead>

    <tbody id="history"></tbody>
  </table>

</div>

<script>

const API_URL = "";

async function checkRisk() {

  const phone = document.getElementById("phone").value;

  const response = await fetch(API_URL + "/check", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({ phone })
  });

  const data = await response.json();

  document.getElementById("result").innerHTML = `
    <h3>النتيجة</h3>
    <p><strong>Score:</strong> ${data.delivery_score}</p>
    <p><strong>Risk:</strong> ${data.risk_level}</p>
  `;

  loadHistory();
}

async function loadHistory(){

  const response = await fetch(API_URL + "/history");

  const data = await response.json();

  let html = "";

  data.forEach(item => {

    html += `
      <tr>
        <td>${item.phone}</td>
        <td>${item.score}</td>
        <td>${item.level}</td>
      </tr>
    `;
  });

  document.getElementById("history").innerHTML = html;
}

loadHistory();

</script>

</body>
</html>
